services:
  db:
    image: mysql:8.2.0
    environment:
      MYSQL_DATABASE: ems
      MYSQL_ROOT_PASSWORD: njidda
    volumes:
      - ems-mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"

  app:
    build: .
    ports:
      - "9000:9000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ems
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: njidda
    depends_on:
      - db

volumes:
  ems-mysql-data:
